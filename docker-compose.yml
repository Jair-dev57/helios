services:
  db:
    image: pgvector/pgvector:pg16
    container_name: helios_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: helios123
      POSTGRES_DB: helios
    ports:
      - "5434:5432"
    volumes:
      - helios_pgdata:/var/lib/postgresql/data

volumes:
  helios_pgdata: